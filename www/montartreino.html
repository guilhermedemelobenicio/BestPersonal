<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    </button>

    <aside id="sidebar-menu" class="sidebar">
        <div class="sidebar-top">
            <div class="user-profile">
                <img class="user-avatar" src="https://via.placeholder.com/150/00E5FF/000000?text=PT" alt="Foto">
                <div class="user-info">
                    <p class="user-name">Nome Personal</p>
                    <a href="perfileditpersonal.html" class="link-profile">Ver Perfil</a>
                </div>
            </div>
            
            <nav class="nav-menu">
                <a href="paginaPersonal.html" class="nav-link">
                    <span class="icon-container">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3"></path></svg>
                    </span>
                    <span>Início</span>
                </a>
                
                <a href="#" class="nav-link">
                    <span class="icon-container">
                         <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18s-3.332.477-4.5 1.253"></path></svg>
                    </span>
                    <span>Biblioteca</span>
                </a>

                <a href="#" class="nav-link">
                    <span class="icon-container">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.111A9.59 9.59 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </span>
                    <span>Chat</span>
                    <span class="badge-count">3</span>
                </a>

                <a href="#" class="nav-link">
                    <span class="icon-container">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.405L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    </span>
                    <span>Notificações</span>
                </a>
                
                <a href="#" class="nav-link">
                    <span class="icon-container">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    </span>
                    <span>Assinatura</span>
                </a>

                <a href="montartreino.html" class="nav-link active"> <span class="icon-container">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </span>

            </nav>
        </div>
        
        <a href="prelogin.html" class="logout-link">
            <span class="icon-container">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4h-12"></path></svg>
            </span>
            <span>Sair</span>
        </a>
    </aside>

    <main class="main-content flex-column">
        <header class="workout-header">
            <div class="student-info-header">
                <img class="student-avatar-small" src="https://via.placeholder.com/150/1a2333/FFFFFF?text=Foto">
                <div>
                    <h1 id="displayNome" class="text-white font-bold text-xl">Carregando Aluno...</h1>
                    <p id="displayDetalhes" class="text-gray-400 text-sm">...</p>
                </div>
            </div>
            <div class="header-buttons">
                <button onclick="excluirTreinoAtual()" class="btn-outline red">Excluir Treino</button>
                <button onclick="alert('Treino Salvo!')" class="btn-save">Salvar Treino</button>
            </div>
        </header>

        <div class="workout-workspace">
            <div class="tabs-wrapper">
                <div id="tabs-container" class="tabs-scroll"></div>
                <div class="tabs-actions">
                    <button onclick="adicionarTreino('letra')" class="btn-mini">+ Letra</button>
                    <button onclick="adicionarTreino('numero')" class="btn-mini">+ Num</button>
                </div>
            </div>

            <input type="text" id="workout-title" class="workout-title-input" placeholder="Nome do Treino (ex: Treino A)">

            <div id="workout-list" class="workout-list-container"></div>

            <button onclick="openExerciseModal()" class="btn-add-big">
                <div class="icon-circle">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <span>Adicionar Exercício</span>
            </button>
            <div style="height: 4rem;"></div>
        </div>
    </main>

    <div id="exerciseModal" class="modal-overlay hidden">
        <div class="modal-backdrop" onclick="closeExerciseModal()"></div>
        <div class="modal-content-large">
            <div class="modal-header">
                <div>
                    <h3 class="modal-title">Biblioteca de Exercícios</h3>
                    <p class="modal-subtitle">Selecione para adicionar</p>
                </div>
                <div class="modal-search-box">
                    <input type="text" id="searchInput" onkeyup="filterExercises()" placeholder="Buscar exercício...">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <button onclick="closeExerciseModal()" class="btn-close-modal">
                     <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="modal-body-flex">
                <div class="categories-sidebar">
                    <p class="cat-label">Superiores</p>
                    <button onclick="filterCategory('todos')" class="cat-btn active" data-cat="todos">Todos</button>
                    </div>
                <div class="exercises-grid-wrapper">
                    <div id="exercisesGrid" class="exercises-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const btnToggle = document.getElementById('btn-toggle-menu');
        const sidebar = document.getElementById('sidebar-menu');

        btnToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('menu-aberto');
        });

        document.addEventListener('click', (e) => {
            if (sidebar.classList.contains('menu-aberto') && !sidebar.contains(e.target) && !btnToggle.contains(e.target)) {
                sidebar.classList.remove('menu-aberto');
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
