<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
    <title>Login Personal - Best Personal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <img src="images/fundo esteira.png" alt="Fundo Academia" class="video-bg">
    <div class="video-overlay"></div>

    <div class="fixed-brand">
        <a href="index.html" class="brand-link">
            <div class="brand-icon-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <span class="brand-text">BestPersonal<span>Pro</span></span>
        </a>
    </div>

    <div class="login-container">
        <div class="glass-effect">
            <h2 class="login-title">Login<span>Personal</span></h2>
            <p class="login-subtitle">Gerencie seus alunos e treinos.</p>

            <form class="auth-form" action="paginaPersonal.html">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" required placeholder="seu@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="password-wrapper">
                        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Sua senha">
                        <button type="button" class="eye-button toggle-password" aria-label="Mostrar senha">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="forgot-link-wrapper">
                    <a href="esqueciminhasenha.html" class="forgot-link">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>

            <div class="divider"></div>

            <div class="login-footer">
                <p style="margin-bottom: 1rem; font-size: 0.8rem; opacity: 0.7;">The Best In The World</p>
                <a href="prelogin.html">Voltar para a escolha de perfil</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
