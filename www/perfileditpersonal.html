    <main class="main-content">
        <header class="page-header-actions">
            <h1 class="page-title">Editar Perfil</h1>
            <button type="submit" form="profile-form" class="btn-save-highlight">
                Salvar Alterações
            </button>
        </header>

        <form id="profile-form" class="space-y-10">
            <section class="card">
                <h2 class="card-title">Dados Pessoais</h2>
                
                <div class="avatar-upload-container">
    <div class="avatar-wrapper">
        <img id="preview-img" class="avatar-xl" src="https://ui-avatars.com/api/?name=Personal+Trainer&background=00E5FF&color=000" alt="Foto do Personal">
        
        <label for="foto-input" class="btn-upload-icon">
            <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.218A2 2 0 0110.455 4h3.09a2 2 0 011.664.89l.812 1.218A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </label>
        <input type="file" id="foto-input" class="hidden" accept="image/*">
    </div>
</div>

                    <div class="inputs-grid-2">
                        <div class="form-group">
                             <label for="nome">Nome</label>
                             <input id="nome" name="nome" type="text" required class="form-input" placeholder="Seu nome">
                        </div>

                        <div class="form-group">
                             <label for="email-principal">E-mail</label>
                             <input id="email-principal" name="email-principal" type="email" required class="form-input" placeholder="seu@email.com">
                        </div>

                        <div class="form-group">
                             <label for="cpf">CPF</label>
                             <input id="cpf" name="cpf" type="text" required class="form-input" placeholder="Exemplo: 123.456.789-00">
                        </div>
                    </div>
                </div>
            </section>

            <section class="dashboard-grid">
                <div class="card">
                    <h2 class="card-title">Alterar dados</h2>
                    <div class="inputs-grid-1">
                        <div class="form-group">
                            <label for="cref">CREF/CRM/CREFITTO</label>
                            <input id="cref" name="cref" type="text" required class="form-input" placeholder="Registro Profissional">
                        </div>
                        <div class="form-group">
                            <label for="celular">Celular</label>
                            <input id="celular" name="celular" type="text" required class="form-input" placeholder="Exemplo (11) 99999-9999">
                        </div>
                        <div class="form-group">
                            <label for="email-secundario">E-mail</label>
                            <input id="email-secundario" name="email-secundario" type="email" required class="form-input" placeholder="seu@email.com">
                        </div>
                        <button type="button" class="btn-green">Alterar dados</button>
                    </div>
                </div>

                <div class="card">
                    <h2 class="card-title">Segurança (Trocar Senha)</h2>
                    <div class="inputs-grid-1">
                        <div class="form-group">
                            <label for="email-seguranca">E-mail</label>
                            <input id="email-seguranca" name="email-seguranca" type="email" required class="form-input" placeholder="seu@email.com">
                        </div>
                        <div class="form-group">
                            <label for="senha-atual">Senha atual</label>
                            <input id="senha-atual" name="senha-atual" type="password" required class="form-input" placeholder="Senha atual">
                        </div>
                        <div class="form-group">
                            <label for="nova-senha">Nova senha</label>
                            <input id="nova-senha" name="nova-senha" type="password" required class="form-input" placeholder="Mínimo 8 caracteres">
                        </div>
                        <button type="button" class="btn-green">Trocar Senha</button>
                    </div>
                </div>
            </section>
            
            <div style="display: flex; justify-content: flex-end; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <button type="submit" class="btn-save-highlight">Salvar Alterações</button>
            </div>
        </form>
    </main>

    <script>
        const btnToggle = document.getElementById('btn-toggle-menu');
        const sidebar = document.getElementById('sidebar-menu');

        btnToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('menu-aberto');
        });

        document.addEventListener('click', (e) => {
            if (sidebar.classList.contains('menu-aberto') && !sidebar.contains(e.target) && !btnToggle.contains(e.target)) {
                sidebar.classList.remove('menu-aberto');
            }
        });
    </script>
